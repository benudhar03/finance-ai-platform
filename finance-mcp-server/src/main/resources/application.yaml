server:
  port: 8888

spring:
  application:
    name: finance-mcp-server

  ai:
    mcp:
      server:
        name: finance-mcp-server
        version: 1.0.0
        protocol: STREAMABLE

  datasource:
    url: jdbc:postgresql://localhost:5432/finance_db
    username: postgres
    password: P@ssw0rd

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5s

app:
  redis:
    ttl-minutes: 10
    refresh-interval-ms: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,mappings